# POOL (H-POOL-001; docs/models/pool_spec.md v1.2 §5, §7), corrida `pool_dev` de DESARROLLO (≤ 2004). NO EJECUTADA.
# Escrita el 25-oct (Validador, rama claude/m3-prep) al pie de la letra de la spec; M2 en su versión PRINCIPAL
# (S-PIT-001 no se disparó: m2_structural_spec.md §9, 6c, commit 5fa4fdf). Una sola pasada.
# Ventana principal del pool por regla = 1985-01 → 2004-12 (§8, sonda). Subperiodos: las dos mitades (la spec no los fija;
# misma convención que el ensayo en seco del arnés). Variantes de §5 junto al pool (se publican; NO eligen).
name: pool_dev
pit_version: "0.4"
models: [persistence_pit, climatology, m0_calibrated_persistence, m2_struct_g, m3_tvtp_g, m3_ctp_g, pool_g, pool_g_eq, pool_g_lin, pool_g_kull, pool_g_unif]
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m2_struct_g: {philly_pre1990_nan: false}      # S-PIT-001 NO se disparó (M2 §9, 6c, 5fa4fdf): versión principal; heredada
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
allow_shrink: false
feature_policy: principal
phase: development
eval_window: ["1985-01", "2004-12"]
epochs: []
subperiods: [["1985-01", "1994-12"], ["1995-01", "2004-12"]]
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: persistence_pit
expected_signs:                 # SOLO informativos (γ ≥ 0 impuesto; m3_tvtp_spec.md §1)
  m3_tvtp_g:
    "G:gamma1": {signo: "+", decide: false}
    "G:gamma2": {signo: "+", decide: false}
    "G:gamma3": {signo: "+", decide: false}
    "G:gamma4": {signo: "+", decide: false}
sign_fraction:                  # criterio de signos de M3 (§5): en desarrollo SOLO se informa (y en P-EVAL-BASE v4.3 es informativo)
  m3_tvtp_g:
    coefs: ["G:gamma1", "G:gamma2", "G:gamma3", "G:gamma4"]
    threshold: 0.01
    min_frac: 0.5
    missing_counts_as_fail: true
holm_families:                  # informativas (como P-EVAL-BASE A8); en desarrollo no deciden
  - nombre: principal_k1
    modo: vintage
    p: p_h0
    miembros:
      - {id: pool_g, modelo: pool_g, metrica: logloss, comparador: m0_calibrated_persistence}
  - nombre: secundarias_componentes
    modo: vintage
    p: p_h0
    miembros:
      - {id: m2, modelo: m2_struct_g, metrica: logloss, comparador: m0_calibrated_persistence}
      - {id: m3, modelo: m3_tvtp_g, metrica: logloss, comparador: m0_calibrated_persistence}
      - {id: m3_ctp, modelo: m3_ctp_g, metrica: logloss, comparador: m0_calibrated_persistence}
who: Constructor (POOL)
nota: "POOL pool_dev: 1985-01 → 2004-12, pool_g y variantes frente a M0. Una sola pasada (después de M3)."
