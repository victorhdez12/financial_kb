# Entregable 4, corrida PRINCIPAL de desarrollo (≤ 2004) de M1 = logística por eje (docs/models/m1_spec.md; H-M1-001).
# Especificación congelada ANTES de correr nada con la etiqueta. Ventana fija = primer corte elegible del eje I con el
# IPC subyacente (1988-06, recuento previo sin ajustar modelos: m1_spec.md §2b) → 2004-12.
name: m1_logit_axis_v1
models: [persistence_pit, climatology, m0_calibrated_persistence, m1_logit_axis, m1_logit_axis_hl, rules_v1]
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m1_logit_axis: {l2: 6.0, l2_pers: 1.0, eps: 0.001}        # fijados a priori (m1_spec.md §3)
  m1_logit_axis_hl: {l2: 6.0, l2_pers: 1.0, eps: 0.001}
  rules_v1: {alpha: 1.0}
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
eval_window: ["1988-06", "2004-12"]
allow_shrink: false
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1988-06", "1996-12"], ["1997-01", "2004-12"]]
feature_policy: principal
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: persistence_pit
phase: development
who: Constructor (M1)
nota: "Entregable 4: M1 (I = IPC subyacente) frente a M0; M1 con IPC general y reglas como secundarios. Ventana 1988-06 → 2004-12."
