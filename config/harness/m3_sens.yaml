# M3 (H-M3-001; docs/models/m3_tvtp_spec.md v1.2 §5, §7), corrida `m3_sens` de DESARROLLO (≤ 2004). NO EJECUTADA.
# Escrita el 25-oct (Validador, rama claude/m3-prep) al pie de la letra de la spec; M2 en su versión PRINCIPAL
# (S-PIT-001 no se disparó: m2_structural_spec.md §9, 6c, commit 5fa4fdf). Una sola pasada.
# Ventana larga, vintage; M0, m3_tvtp_g y las sensibilidades de §7 (se publican; NO eligen ni entran en el pool).
name: m3_sens
pit_version: "0.4"
models: [m0_calibrated_persistence, m3_tvtp_g, m3_tvtp_g_l16, m3_tvtp_g_l12, m3_tvtp_g_fac, m3_tvtp_g_nocal]
model_params:
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m2_struct_g: {philly_pre1990_nan: false}      # S-PIT-001 NO se disparó (M2 §9, 6c, 5fa4fdf): versión principal; heredada
modes: [vintage]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
allow_shrink: false
feature_policy: principal
phase: development
eval_window: ["1978-10", "2004-12"]
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1978-10", "1989-12"], ["1990-01", "2004-12"]]
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: m3_tvtp_g
who: Constructor (M3)
nota: "M3 m3_sens: sensibilidades preregistradas de §7, ventana larga, vintage. No eligen. Una sola pasada."
