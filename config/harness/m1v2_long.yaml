# M1 v2 (H-M1-002; docs/models/m1_v2_spec.md), corrida de VENTANA LARGA de desarrollo (≤ 2004): EJE G de M1 v2 con el
# eje I de M0 (`m1v2_g`, sin variables en I) frente a M0 y frente al eje G de M1 v1 (`m1_logit_axis_hl`, el de la ventana
# larga de M1 v1). Ventana fija = primer corte en que el eje G de M1 v2 es elegible en TODOS los cortes de los dos
# modos (1978-07: claims_4w_yoy desde 1968-02 + 120 meses + embargo; recuento sin ajustar modelos, m1_v2_spec.md §3).
name: m1v2_long
pit_version: "0.4"
models: [persistence_pit, climatology, m0_calibrated_persistence, m1_logit_axis_hl, m1v2_g]
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m1_logit_axis_hl: {l2: 6.0, l2_pers: 1.0, eps: 0.001}
  m1v2_g: {l2: 6.0, l2_pers: 1.0, eps: 0.001}
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
eval_window: ["1978-07", "2004-12"]
allow_shrink: false
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1978-07", "1989-12"], ["1990-01", "2004-12"]]
feature_policy: principal
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: persistence_pit
expected_signs:
  m1v2_g:
    "G:growth_rt": "+"
    "G:claims_4w_yoy": "-"
    "G:curve_min12": "+"
    "G:baa_gap10y": "-"
    "G:baa_d6m": "-"
    "G:eq_ret_6m": "+"
    "G:sahm_d3m": "-"
    "G:pers": "+"
phase: development
who: Constructor (M1 v2)
nota: "M1 v2, ventana larga 1978-07 → 2004-12: eje G de M1 v2 (eje I de M0) frente a M0 y al eje G de M1 v1. Una sola pasada."
