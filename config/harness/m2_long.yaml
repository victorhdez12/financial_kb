# M2 (H-M2-001; docs/models/m2_structural_spec.md v1.2 §6), corrida 6a `m2_long` de DESARROLLO (≤ 2004). NO EJECUTADA:
# espera la revisión del usuario (preguntas de implementación, Bitácora 24-oct). Ventana larga desde W_G = 1978-10
# (sonda de elegibilidad, research/trials/m2/elegibilidad.json; regla de §6). Una sola pasada.
name: m2_long
pit_version: "0.4"
models: [persistence_pit, climatology, m0_calibrated_persistence, m2_struct_g, m1v2_g]
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m2_struct_g: {philly_pre1990_nan: false}      # versión principal; S-PIT-001 se resuelve en 6c con s_pit_001
  m1v2_g: {l2: 6.0, l2_pers: 1.0, eps: 0.001}
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
eval_window: ["1978-10", "2004-12"]
allow_shrink: false
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1978-10", "1989-12"], ["1990-01", "2004-12"]]
feature_policy: principal
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: persistence_pit
expected_signs:                 # se informan (spec §1); no se imponen ni deciden
  m2_struct_g:
    "G:lambda_INDPRO": {signo: "+", decide: false}
    "G:lambda_PAYEMS": {signo: "+", decide: false}
    "G:lambda_W875RX1": {signo: "+", decide: false}
    "G:lambda_CMRMTSPL": {signo: "+", decide: false}
    "G:lambda_philly_neworders": {signo: "+", decide: false}
    "G:lambda_claims_4w_yoy": {signo: "-", decide: false}
phase: development
who: Constructor (M2)
nota: "M2 m2_long (6a): W_G 1978-10 → 2004-12, frente a M0; m1v2_g como referencia. Una sola pasada."
