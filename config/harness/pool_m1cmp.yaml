# POOL (H-POOL-001; docs/models/pool_spec.md v1.2 §5), corrida `pool_m1cmp` de DESARROLLO (≤ 2004). NO EJECUTADA.
# Escrita el 25-oct (Validador, rama claude/m3-prep) al pie de la letra de la spec; M2 en su versión PRINCIPAL
# (S-PIT-001 no se disparó: m2_structural_spec.md §9, 6c, commit 5fa4fdf). Una sola pasada.
# Comparable con M1 v2: 1989-10 → 2004-12. Referencia = m1v2_logit_axis.
name: pool_m1cmp
pit_version: "0.4"
models: [m0_calibrated_persistence, pool_g, m2_struct_g, m3_tvtp_g, m1v2_logit_axis, m1_logit_axis]
model_params:
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m2_struct_g: {philly_pre1990_nan: false}      # S-PIT-001 NO se disparó (M2 §9, 6c, 5fa4fdf): versión principal; heredada
  m1v2_logit_axis: {l2: 6.0, l2_pers: 1.0, eps: 0.001, i_slope: 1.7, i_center: 2.9, i_scale: 0.75}   # m1_v2_spec.md §2-§4
  m1_logit_axis: {l2: 6.0, l2_pers: 1.0, eps: 0.001}                 # m1_spec.md §3
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
allow_shrink: false
feature_policy: principal
phase: development
eval_window: ["1989-10", "2004-12"]
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1989-10", "1996-12"], ["1997-01", "2004-12"]]
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: m1v2_logit_axis
who: Constructor (POOL)
nota: "POOL pool_m1cmp: pool frente a M0 y a M1 v1/v2 en 1989-10 → 2004-12. Una sola pasada."
