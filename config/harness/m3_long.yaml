# M3 (H-M3-001; docs/models/m3_tvtp_spec.md v1.2 §5), corrida `m3_long` de DESARROLLO (≤ 2004). NO EJECUTADA.
# Escrita el 25-oct (Validador, rama claude/m3-prep) al pie de la letra de la spec; M2 en su versión PRINCIPAL
# (S-PIT-001 no se disparó: m2_structural_spec.md §9, 6c, commit 5fa4fdf). Una sola pasada.
# Ventana larga = la de M2 (W_G 1978-10 → 2004-12). Referencia = m3_ctp_g (contraste M3 − CTP de H-M3-001).
name: m3_long
pit_version: "0.4"
models: [persistence_pit, climatology, m0_calibrated_persistence, m3_tvtp_g, m3_ctp_g, m2_struct_g]
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m2_struct_g: {philly_pre1990_nan: false}      # S-PIT-001 NO se disparó (M2 §9, 6c, 5fa4fdf): versión principal; heredada
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
allow_shrink: false
feature_policy: principal
phase: development
eval_window: ["1978-10", "2004-12"]
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1978-10", "1989-12"], ["1990-01", "2004-12"]]
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: m3_ctp_g
expected_signs:                 # SOLO informativos (γ ≥ 0 impuesto; m3_tvtp_spec.md §1)
  m3_tvtp_g:
    "G:gamma1": {signo: "+", decide: false}
    "G:gamma2": {signo: "+", decide: false}
    "G:gamma3": {signo: "+", decide: false}
    "G:gamma4": {signo: "+", decide: false}
sign_fraction:                  # criterio de signos de M3 (§5): en desarrollo SOLO se informa (y en P-EVAL-BASE v4.3 es informativo)
  m3_tvtp_g:
    coefs: ["G:gamma1", "G:gamma2", "G:gamma3", "G:gamma4"]
    threshold: 0.01
    min_frac: 0.5
    missing_counts_as_fail: true
holm_families:                  # informativa (como P-EVAL-BASE A8); no decide en desarrollo
  - nombre: m3_tvtp_frente_a_ctp
    modo: vintage
    p: p_h0
    miembros:
      - {id: tvtp_vs_ctp, modelo: m3_tvtp_g, metrica: ll_g, comparador: m3_ctp_g}
who: Constructor (M3)
nota: "M3 m3_long: W_G 1978-10 → 2004-12, frente a M0 y a m3_ctp_g; m2_struct_g en la corrida (emisión compartida). Una sola pasada."
