# Entregable 4, SENSIBILIDAD preregistrada de la L2 de M1 (m1_spec.md §6): l2 = 2 y 18 (÷3 y ×3 de la a priori, 6).
# Se publica siempre; NO elige la L2 (la de M1 es 6 y no cambia). Ventana de la corrida principal. Solo vintage.
name: m1_logit_axis_v1_sens
models: [m0_calibrated_persistence, m1_logit_axis_l2lo, m1_logit_axis_l2hi]
model_params:
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m1_logit_axis_l2lo: {l2: 2.0, l2_pers: 1.0, eps: 0.001}
  m1_logit_axis_l2hi: {l2: 18.0, l2_pers: 1.0, eps: 0.001}
modes: [vintage]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
eval_window: ["1989-10", "2004-12"]   # post hoc técnico (m1_spec.md §9): 1988-06 → 1989-10
allow_shrink: false
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1989-10", "1996-12"], ["1997-01", "2004-12"]]
feature_policy: principal
provisional_weighting: madurez
baseline: m0_calibrated_persistence
phase: development
who: Constructor (M1)
nota: "Sensibilidad preregistrada de la L2 de M1 (2 y 18); no elige."
