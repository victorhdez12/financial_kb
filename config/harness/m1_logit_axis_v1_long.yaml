# Entregable 4, corrida de VENTANA LARGA de desarrollo (≤ 2004): eje G de M1 + eje I con IPC general (m1_spec.md §2b).
# Especificación congelada ANTES de correr nada con la etiqueta. Ventana fija = primer corte elegible del eje G
# con growth_rt (1975-06, recuento previo sin ajustar modelos) → 2004-12.
name: m1_logit_axis_v1_long
models: [persistence_pit, climatology, m0_calibrated_persistence, m1_logit_axis_hl, rules_v1_hl]   # post hoc técnico (m1_spec.md §9): reglas con IPC general
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m1_logit_axis_hl: {l2: 6.0, l2_pers: 1.0, eps: 0.001}
  rules_v1_hl: {alpha: 1.0}
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
eval_window: ["1975-06", "2004-12"]
allow_shrink: false
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1975-06", "1989-12"], ["1990-01", "2004-12"]]
feature_policy: principal
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: persistence_pit
phase: development
who: Constructor (M1)
nota: "Entregable 4: ventana larga 1975-06 → 2004-12 (primer corte elegible del eje G): M1 con IPC general en el eje I (época previa al subyacente; el eje G es el de M1) y reglas frente a M0."
