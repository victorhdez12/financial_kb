# M1 v2 (H-M1-002; docs/models/m1_v2_spec.md), corrida PRINCIPAL de desarrollo (≤ 2004). Especificación congelada ANTES
# de correr nada con la etiqueta. Base PIT v0.4 (candidata: solo desarrollo). Ventana fija = la de M1 v1 (1989-10, desde
# donde el eje I con el IPC subyacente es elegible en TODOS los cortes de los dos modos; recuento sin ajustar modelos,
# m1_v2_spec.md §3). M1 v1 corre en la misma corrida (mismos meses) para la comparación v2 − v1.
name: m1v2_principal
pit_version: "0.4"
models: [persistence_pit, climatology, m0_calibrated_persistence, m1_logit_axis, m1v2_logit_axis]
model_params:
  climatology: {alpha: 1.0}
  m0_calibrated_persistence: {eps: 0.001, l2: 1.0}
  m1_logit_axis: {l2: 6.0, l2_pers: 1.0, eps: 0.001}                 # M1 v1 tal cual (m1_spec.md §3)
  m1v2_logit_axis: {l2: 6.0, l2_pers: 1.0, eps: 0.001, i_slope: 1.7, i_center: 2.9, i_scale: 0.75}   # m1_v2_spec.md §2-§4
modes: [vintage, latest_truncated]
refit_every: 1
embargo_months: 6
min_train_months: 120
min_train_recessions: 2
min_train_g_changes: 8
test_start: "1956-10"
test_end: "2004-12"
eval_window: ["1989-10", "2004-12"]
allow_shrink: false
epochs: [["1956-01", "1979-12"], ["1980-01", "2004-12"]]
subperiods: [["1989-10", "1996-12"], ["1997-01", "2004-12"]]
feature_policy: principal
provisional_weighting: madurez
baseline: m0_calibrated_persistence
reference: persistence_pit
expected_signs:
  m1v2_logit_axis:
    "G:growth_rt": "+"
    "G:claims_4w_yoy": "-"
    "G:curve_min12": "+"
    "G:baa_gap10y": "-"
    "G:baa_d6m": "-"
    "G:eq_ret_6m": "+"
    "G:sahm_d3m": "-"
    "G:pers": "+"
    "I:pers": "+"
phase: development
who: Constructor (M1 v2)
nota: "M1 v2 (H-M1-002, contaminada por M1 v1) frente a M0; M1 v1 en la misma corrida. Ventana 1989-10 → 2004-12. Una sola pasada."
