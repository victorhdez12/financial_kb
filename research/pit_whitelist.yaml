     mecanismo: "El empleo es el indicador coincidente central del NBER; su ritmo de 3 meses mide el impulso actual.", signo_esperado: "+ P(G alto)",
     admision: {fuente_viva: FRED/ALFRED, historia: "1939-; 11 recesiones", pit: "ALFRED desde 1955-05", disponibilidad: "completa desde 1950"}}
  - {nombre: unrate_sahm, bloque: crecimiento, tipo: serie, series: [UNRATE], transformacion: {fn: sahm}, modo: vintage, estado: principal,
