# Lista blanca de variables de la base point-in-time (docs/models/pit_base.md; código: src/features/pit.py).
#
# Solo lo que está aquí puede entrar en la matriz. La lista negra de la etiqueta (assert_no_forbidden) es la segunda
# barrera. Transformaciones FIJADAS A PRIORI, sin mirar la relación con la etiqueta. Un cambio = versión nueva.
#
# Campos
#   nombre           columna de la matriz ("_" = auxiliar, no sale en la matriz)
#   tipo             serie (series del warehouse, por prioridad) | derivada (función de columnas)
#   transformacion   {fn, ...} sobre el índice de observación (pit.TRANSFORMS); funcion/entradas para derivadas (pit.DERIVED)
#   modo             vintage (tal como se publicó donde haya vintages) | latest_truncated
#   estado           principal | principal_epoca | modulo_adicional | condicional | auxiliar
#   desde            (opcional) la columna es NaN antes de esta fecha de decisión (sin mecanismo / sin datos fiables)
#   principal_desde  (opcional) antes de esta fecha la variable es CONDICIONAL: fuera del modelo principal (la serie no
#                    existía en tiempo real con esa definición). El arnés no la usa antes en el modelo principal.
#                    REGLA GENERAL (v0.3): una derivada hereda el principal_desde MÁS TARDÍO de todas sus entradas,
#                    recorriendo el grafo (pit.effective_principal_desde); el meta lo publica como principal_desde_efectivo.
#   admision         regla de admisión (docs/PLAN.md)
#   unidades/factor  unidades esperadas en el catálogo (falla si cambian) y escala fija
#
# v0.2 (2026-10-15, revisiones del Validador y del Estratega macro aprobadas por el usuario): growth_rt frente a la
# tendencia de 10 años (MAD) con histéresis ±0,5 σ y 2 meses; tcu_gap; cobre/oro y dólar desde 1973; Michigan desde
# 1978 con fuente directa; inflación separada en núcleo (pp) y energía (z); A1-A9; curva en 4 estados (25 pb);
# GZ < 2012, M2 < 1980 e IPC subyacente < 1978 condicionales.
# v0.3 (2026-10-15, re-auditoría del Validador de la v0.2): herencia de principal_desde por dependencias (afecta a
# infl_energy_pressure → 1978-01); vix condicional antes de 2003-09-22; fechas de existencia no verificadas declaradas.
# v0.3 tras re-auditoría (2026-10-16, Validador H-1, decisión del usuario): tcu_gap condicional antes de 1984-01-01
# (la utilización de la industria total existe desde 1983; G.17 de la Fed). Ninguna derivada usa tcu_gap.
# v0.4 (2026-10-23, decisión del usuario sobre la revisión del Estratega de M1, docs/reviews/2026-10-16_estratega_macro_m1.md
# §5): 4 derivadas de RIESGO DE GIRO fijadas a priori con su mecanismo (curve_min12, baa_gap10y, baa_d6m, sahm_d3m),
# calculadas sobre la rejilla con valores ya PIT de columnas de la v0.3 (curve_10y3m, baa_spread, unrate_sahm). Las 58
# columnas de la v0.3 no cambian (misma instantánea de datos y mismas funciones). claims_4w_yoy y Filadelfia ya estaban
# en la v0.3 (filas 1 y 6 de la tabla del Estratega): no se tocan.

version: "0.4"
fecha: 2026-10-23
zscore_min_meses: 120          # z-scores expansivos: solo historia <= t, mínimo 10 años
tendencia_meses: 120           # tendencia unilateral: mediana de los 120 meses hasta t
mad_min_meses: 60              # escala MAD expansiva de (g - tendencia): mínimo 5 años
histeresis_sigma: 0.5          # banda de growth_rt_state en desviaciones típicas expansivas de growth_rt
histeresis_confirmacion: 2     # meses seguidos fuera de la banda para cambiar de estado (Sahm >= 0,5 manda sin esperar)
curva_umbral_pb: 25            # |Δ3m curva| < 25 pb = sin cambio
salario_productividad_pp: 1.5  # salarios a/a - 1,5 pp de productividad en infl_core_pressure

variables:
  # ======================================================================= CRECIMIENTO
