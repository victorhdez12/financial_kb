# Calendario de publicación point-in-time (ficha: docs/models/pit_calendar.md; código: src/features/calendar.py).
#
# Una entrada por serie que lee el constructor (research/pit_whitelist.yaml y sus proxies).
#   frecuencia            D, W, M, Q, A (la de la fecha de referencia del warehouse)
#   ancla                 fin_periodo (por defecto: fin del mes/trimestre de referencia; para D/W, la fecha del dato)
#                         | inicio_periodo (encuestas fechadas en el inicio del trimestre, p. ej. SPF)
#   retardo_dias          tramos {desde (fecha de referencia), dias, supuesto}: días desde el ancla hasta la PRIMERA
#                         publicación. Solo se usa donde las vintages no fechan la publicación (antes del archivo de
#                         vintages o series sin vintages). Valor CONSERVADOR. `supuesto: false` = medido con vintages.
#   retardo_dias_prudente variante de sensibilidad preregistrada (load_calendar(variant="prudente"))
#   proxies_publicacion   series con vintages cuyo primer realtime_start da la fecha de publicación exacta
#                         (la propia serie u otra del mismo comunicado). Las vintages se leen del warehouse o, si no
#                         están, de <FIN_DATA_ROOT>/features/raw/alfred (src/features/alfred_raw.py).
#   vintages              fuentes de vintage para el modo `vintage`, en orden de prioridad.
# Fecha de decisión: último día hábil (calendario federal de EE. UU.) del mes t (ficha de la etiqueta §9).
# Medición: research/pit_calendar_measured.csv (.venv/bin/python -m src.features.calendar).
# v0.2 (2026-10-15): BCE 8 d; PERMIT/CMRMTSPL/NFCI/W875RX1 con vintages ALFRED; Michigan directo a 20 d; SPF < 1990 a
# 90 d; Filadelfia con variante prudente < 1990; CMRMTSPL 90 d < 2000; BIS 20 d; supuestos marcados por tramo.
# v0.3: NFCI 12 d de reserva (máximo medido en 2000-12; regla 3 = máximo, no p90).

version: "0.3"
fecha: 2026-10-15
series:
  # ---------------------------------------------------------------- empleo (Employment Situation, BLS)
  PAYEMS:
    publicacion: BLS Employment Situation (primer viernes del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 16, supuesto: true}]
    proxies_publicacion: [PAYEMS]
    vintages: [PAYEMS]
    fuente: ALFRED PAYEMS desde 1955-05 (medido; <1980 mediana 7, p90 11, máx 16). Antes de 1955 (sin vintages), el máximo de <1980 (supuesto).
  UNRATE:
    publicacion: BLS Employment Situation (encuesta de hogares)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 16, supuesto: true}]
    proxies_publicacion: [UNRATE, PAYEMS]
    vintages: [UNRATE]
    fuente: ALFRED UNRATE desde 1960-03 y PAYEMS (mismo comunicado) desde 1955-05 (medido). Antes de 1955, supuesto.
  AWHMAN:
    publicacion: BLS Employment Situation (horas semanales medias, manufactura)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 16, supuesto: true}]
    proxies_publicacion: [AWHMAN, PAYEMS]
    fuente: Vintages propias (features/raw/alfred, desde 1961-11) y de PAYEMS (mismo comunicado).
  AHETPI:
    publicacion: BLS Employment Situation (salario por hora, trabajadores de producción)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 16, supuesto: true}]
    proxies_publicacion: [AHETPI, PAYEMS]
    vintages: [AHETPI]
    fuente: Vintages propias desde 1999-08 (features/raw/alfred) y fechas de PAYEMS (mismo comunicado) desde 1955.
  ICSA:
    publicacion: DOL Unemployment Insurance Weekly Claims (jueves, semana que acaba el sábado anterior)
    frecuencia: W
    retardo_dias: [{desde: 1900-01-01, dias: 6, supuesto: true}]
    proxies_publicacion: [ICSA]
    vintages: [ICSA]
    fuente: ALFRED ICSA desde 2009-05 (medido; mediana 5, p90 5). Antes de 2009, supuesto 6 días (mismo calendario de jueves).
  # ---------------------------------------------------------------- actividad
  INDPRO:
    publicacion: Fed G.17 Industrial Production and Capacity Utilization (mediados del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 33, supuesto: false}]
    proxies_publicacion: [INDPRO]
    vintages: [INDPRO]
    fuente: ALFRED INDPRO desde 1927-01 (medido; <1980 mediana 18, p90 28, máx 33; 1980+ mediana 15-16, p90 17).
  TCU:
    publicacion: Fed G.17 (utilización de la capacidad)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 33, supuesto: false}]
    proxies_publicacion: [TCU, INDPRO]
    vintages: [TCU]
    fuente: ALFRED TCU desde 1996-11 e INDPRO (mismo comunicado) desde 1927 (medido).
  CFNAI:
    publicacion: Chicago Fed National Activity Index (hacia el día 20-25 del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 28, supuesto: true}]
    proxies_publicacion: [CFNAI]
    vintages: [CFNAI]
    fuente: ALFRED CFNAI desde 2011-05 (medido; mediana 23, p90 26). Se publica desde 2001; antes es historia reconstruida.
  GDPC1:
    publicacion: BEA PIB real, estimación avance (~30 días tras el trimestre)
    frecuencia: Q
    retardo_dias: [{desde: 1900-01-01, dias: 60, supuesto: true}]
    proxies_publicacion: [GDPC1, rtdsm_routput]
    vintages: [GDPC1, rtdsm_routput]
    fuente: >
      ALFRED GDPC1 desde 1991-12 (medido; mediana 29, p90 31) y RTDSM (Fed de Filadelfia) desde 1965-11, cuyas
      vintages están fechadas a mitad de mes (cota superior: ~46 días). Antes de 1965, supuesto 60 días.
  rtdsm_routput:
    publicacion: RTDSM, Fed de Filadelfia (vintage de mitad de mes del PIB real)
    frecuencia: Q
    retardo_dias: [{desde: 1900-01-01, dias: 60, supuesto: true}]
    proxies_publicacion: [rtdsm_routput]
    vintages: [rtdsm_routput]
    fuente: Solo como fuente de vintages de GDPC1 antes de 1991.
  W875RX1:
    publicacion: BEA Personal Income and Outlays (renta personal real sin transferencias; finales del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 35, supuesto: true}]
    proxies_publicacion: [W875RX1, PCEPI]
    vintages: [W875RX1]
    fuente: >
      Vintages propias desde 2010-05 (features/raw/alfred; mediana 29, p90 32, máx 83 en el cierre de 2013) y fechas de
      PCEPI (mismo comunicado) desde 2000-08 (medido). Antes de 2000, supuesto 35 días: el retardo efectivo cambia en
      2000 (t−2 → t−1 en ~20 % de los meses) al pasar a fechas medidas.
  CMRMTSPL:
    publicacion: BEA, ventas reales de manufactura y comercio (detalle NIPA, ~2 meses después)
    frecuencia: M
    retardo_dias:
      - {desde: 1900-01-01, dias: 90, supuesto: true}
      - {desde: 2000-01-01, dias: 70, supuesto: true}
    proxies_publicacion: [CMRMTSPL]
    vintages: [CMRMTSPL]
    fuente: >
      Vintages ALFRED desde 2013-06 (features/raw/alfred; mediana 60, p90 66, máx 114: cubren los cierres de 2013 y
      2025). Antes: supuesto 90 días hasta 1999 y 70 días en 2000-2012 (calendario anterior a 2013 no medido).
  PERMIT:
    publicacion: Census New Residential Construction (hacia el 12.º día hábil del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 23, supuesto: true}]
    proxies_publicacion: [PERMIT]
    vintages: [PERMIT]
    fuente: >
      Vintages ALFRED desde 1999-08 (features/raw/alfred): fechan los comunicados reales, también los retrasos de los
      cierres del Gobierno de 2013 y 2025. Antes, supuesto 23 días (máximo medido en 2000-12: 22; Census ~día 17-19).
  GACDFSA066MSFRBPHI:
    publicacion: Fed de Filadelfia, Manufacturing Business Outlook Survey (tercer jueves del MISMO mes)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: -7, supuesto: true}]
    retardo_dias_prudente:
      - {desde: 1900-01-01, dias: 25, supuesto: true}
      - {desde: 1990-07-01, dias: -7, supuesto: true}
    proxies_publicacion: [GACDFSA066MSFRBPHI]
    fuente: >
      Se publica el tercer jueves del mes de referencia (≤ día 21): fin de mes − 7 días es siempre posterior. Las vintages
      ALFRED (2015+) lo confirman. Calendario 1968-90 NO verificado: variante prudente (dato de t−1 antes de 1990-07),
      preregistrada como sensibilidad. Factores estacionales revisados cada año (sin vintages antes de 2015).
  NOCDFSA066MSFRBPHI:
    publicacion: Fed de Filadelfia, Manufacturing Business Outlook Survey (nuevos pedidos)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: -7, supuesto: true}]
    retardo_dias_prudente:
      - {desde: 1900-01-01, dias: 25, supuesto: true}
      - {desde: 1990-07-01, dias: -7, supuesto: true}
    proxies_publicacion: [NOCDFSA066MSFRBPHI]
    fuente: Igual que GACDFSA066MSFRBPHI.
  PPCDFSA066MSFRBPHI:
    publicacion: Fed de Filadelfia, Manufacturing Business Outlook Survey (precios pagados)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: -7, supuesto: true}]
    retardo_dias_prudente:
      - {desde: 1900-01-01, dias: 25, supuesto: true}
      - {desde: 1990-07-01, dias: -7, supuesto: true}
    proxies_publicacion: [PPCDFSA066MSFRBPHI]
    fuente: Igual que GACDFSA066MSFRBPHI.
  umich_ics:
    publicacion: Universidad de Michigan, Surveys of Consumers, índice de sentimiento (fuente directa, src/ingest/umich.py)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 20, supuesto: true}]
    fuente: >
      El dato final del mes t sale a finales de t (preliminar a mediados). Supuesto prudente de 20 días tras el fin de
      mes: siempre se usa t−1. Solo desde 1978-01 (antes, trimestral/irregular). Encuesta web desde 2024 (salto de nivel).
  umich_px1_md:
    publicacion: Universidad de Michigan, expectativa de inflación a 1 año, mediana (fuente directa)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 20, supuesto: true}]
    fuente: Igual que umich_ics.
  # ---------------------------------------------------------------- precios
  CPIAUCSL:
    publicacion: BLS Consumer Price Index (mediados del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 32, supuesto: true}]
    proxies_publicacion: [CPIAUCSL]
    vintages: [CPIAUCSL]
    fuente: >
      ALFRED CPIAUCSL desde 1972-07 (medido; <1980 mediana 21, p90 26, máx 31; 1980-99 mediana 19, máx 32;
      2000-12 mediana 16; 2013+ mediana 13). Antes de 1972, supuesto 32 días: deja el IPC en t−2 hasta 1972 (en la
      realidad, probablemente t−1); conservador, pero el retardo efectivo cambia en 1972.
  CPILFESL:
    publicacion: BLS CPI (subyacente), mismo comunicado que CPIAUCSL
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 32, supuesto: true}]
    proxies_publicacion: [CPILFESL, CPIAUCSL]
    vintages: [CPILFESL]
    fuente: ALFRED CPILFESL desde 1996-12; fechas de CPIAUCSL (mismo comunicado) desde 1972-07 (medido). Antes, supuesto.
  CUSR0000SASLE:
    publicacion: BLS CPI, servicios sin energía (mismo comunicado que CPIAUCSL)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 32, supuesto: true}]
    proxies_publicacion: [CUSR0000SASLE, CPIAUCSL]
    vintages: [CUSR0000SASLE]
    fuente: Vintages propias desde 2011-04 (features/raw/alfred) y fechas de CPIAUCSL desde 1972-07.
  PCEPI:
    publicacion: BEA Personal Income and Outlays (finales del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 35, supuesto: true}]
    proxies_publicacion: [PCEPI]
    vintages: [PCEPI]
    fuente: ALFRED PCEPI desde 2000-08 (medido; mediana 29-30, p90 32, máx 35). Antes de 2000, supuesto 35 días.
  PCEPILFE:
    publicacion: BEA Personal Income and Outlays (PCE subyacente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 35, supuesto: true}]
    proxies_publicacion: [PCEPILFE, PCEPI]
    vintages: [PCEPILFE]
    fuente: ALFRED PCEPILFE desde 2000-08 (medido). Antes de 2000, supuesto 35 días; historia reconstruida.
  PPIACO:
    publicacion: BLS Producer Price Index (mediados del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 21, supuesto: true}]
    proxies_publicacion: [PPIACO]
    vintages: [PPIACO]
    fuente: ALFRED PPIACO desde 1996-12 (medido; mediana 12-15, p90 14-19). Antes de 1996, supuesto 21 días.
  WPU0561:
    publicacion: BLS PPI, petróleo crudo (mismo comunicado que PPIACO)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 21, supuesto: true}]
    proxies_publicacion: [PPIACO]
    fuente: Fechas de PPIACO (mismo comunicado) desde 1996-12; antes, supuesto 21 días.
  MCOILWTICO:
    publicacion: Precio WTI, media mensual de datos diarios de mercado (EIA vía FRED)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}]
    fuente: Media de precios de mercado del mes; conocida al cierre del mes. No se revisa.
  M2SL:
    publicacion: Fed H.6 Money Stock (semanal hasta 2021; mensual desde 2021)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 21, supuesto: true}]
    proxies_publicacion: [M2SL]
    vintages: [M2SL]
    fuente: >
      ALFRED M2SL desde 1980-02 (medido; 1980-2012 mediana 13, p90 16; 2013+ mediana 15, p90 27: el H.6 pasó a
      mensual en 2021). Antes de 1980, supuesto 21 días; el M2 actual se definió en 1980 (historia reconstruida).
  # ---------------------------------------------------------------- expectativas con fecha (SPF)
  spf_mean_cpi_6: &spf
    publicacion: Survey of Professional Forecasters (Fed de Filadelfia desde 1990-T2; antes ASA-NBER)
    frecuencia: Q
    ancla: inicio_periodo
    retardo_dias:
      - {desde: 1900-01-01, dias: 90, supuesto: true}
      - {desde: 1990-07-01, dias: 50, supuesto: true}
    fuente: >
      Fecha = inicio del trimestre de la encuesta; resultados a mediados del 2.º mes (~45 días, catálogo).
      Supuesto: 50 días desde 1990-T3; 90 antes (ASA-NBER: difusión no documentada → disponible el trimestre siguiente).
  spf_mean_rgdp_2: *spf
  spf_mean_rgdp_6: *spf
  spf_med_pgdp_2: *spf
  spf_med_pgdp_6: *spf
  spf_anxious_index: *spf
  # ---------------------------------------------------------------- tipos y mercados (no se revisan)
  T10Y3M: {publicacion: "FRED, 10 años − 3 meses (H.15, diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "H.15 publica el dato del día d el día hábil siguiente; con decisión en día hábil, 1 día basta."}
  DGS10: {publicacion: "H.15, Treasury 10 años (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que T10Y3M."}
  DTB3: {publicacion: "H.15, letras a 3 meses, mercado secundario (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que T10Y3M."}
  GS10: {publicacion: "H.15, Treasury 10 años, media mensual", frecuencia: M, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Media de datos diarios del mes, conocida al cierre."}
  GS1: {publicacion: "H.15, Treasury 1 año, media mensual", frecuencia: M, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que GS10."}
  TB3MS: {publicacion: "H.15, letras a 3 meses, media mensual", frecuencia: M, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que GS10."}
  FEDFUNDS: {publicacion: "H.15, fed funds efectivo, media mensual", frecuencia: M, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que GS10."}
  DFF: {publicacion: "H.15, fed funds efectivo (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que T10Y3M."}
  BAA10Y: {publicacion: "Moody's Baa − Treasury 10 años (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que T10Y3M."}
  BAA: {publicacion: "Moody's Baa, media mensual", frecuencia: M, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que GS10."}
  VIXCLS: {publicacion: "CBOE VIX, cierre diario", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Cierre del día; 1 día por prudencia."}
  T5YIE: {publicacion: "Breakeven 5 años (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que T10Y3M."}
  DFII10: {publicacion: "TIPS 10 años, rendimiento real (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Igual que T10Y3M."}
  DEXUSEU: {publicacion: "H.10, USD por euro (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Precio de mercado."}
  DEXJPUS: {publicacion: "H.10, yenes por USD (diario)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Precio de mercado."}
  shiller_sp_price:
    publicacion: S&P Composite, media mensual de cierres diarios (Shiller)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}]
    fuente: Precio de mercado (media del mes), conocido al cierre del mes. El fichero de Shiller llega más tarde, pero el dato es público en tiempo real.
  wb_copper:
    publicacion: Banco Mundial, Pink Sheet (medias mensuales; 2.º-3.er día hábil del mes siguiente)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 7, supuesto: true}]
    fuente: Precio de mercado medio del mes; supuesto 7 días (a 2026-10-15 ya está 2026-09).
  wb_gold:
    publicacion: Banco Mundial, Pink Sheet (oro)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 7, supuesto: true}]
    fuente: Igual que wb_copper.
  bis_eer_us_neer_narrow_m:
    publicacion: BIS, tipo de cambio efectivo nominal, cesta estrecha (mensual)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 20, supuesto: true}]
    fuente: Agregado de tipos de cambio de mercado (calculable con el H.10); 20 días para que sea siempre t−1. Ponderaciones comerciales construidas a posteriori.
  # ---------------------------------------------------------------- crédito y condiciones financieras
  fed_ebp_gz_spread:
    publicacion: Fed (Favara et al.), CSV del GZ spread y EBP (mensual)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 35, supuesto: true}]
    fuente: Supuesto 35 días (a 2026-10-15 ya está 2026-09). Se publica desde 2012 (Gilchrist-Zakrajšek, AER); historia anterior construida entonces.
  fed_ebp_ebp:
    publicacion: Fed (Favara et al.), excess bond premium (mensual)
    frecuencia: M
    retardo_dias: [{desde: 1900-01-01, dias: 35, supuesto: true}]
    fuente: Igual que fed_ebp_gz_spread. Estimado con parámetros de toda la muestra (catálogo).
  NFCI:
    publicacion: Chicago Fed NFCI (miércoles, semana que acaba el viernes anterior)
    frecuencia: W
    retardo_dias: [{desde: 1900-01-01, dias: 12, supuesto: true}]
    proxies_publicacion: [NFCI]
    vintages: [NFCI]
    fuente: Vintages ALFRED desde 2011-05 (features/raw/alfred; mediana 5, p90 6, máx 12 en 2011-12). Antes de 2011, supuesto 12 días (el máximo); historia reestimada.
  # ---------------------------------------------------------------- liquidez
  WALCL: {publicacion: "Fed H.4.1, activos totales (miércoles; jueves 16:30)", frecuencia: W, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Calendario del H.4.1."}
  WTREGEN: {publicacion: "Fed H.4.1, cuenta del Tesoro (TGA), media de la semana al miércoles", frecuencia: W, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Calendario del H.4.1."}
  RRPONTSYD: {publicacion: "NY Fed, repos inversos ON (diario, 13:15)", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "Resultado de la operación del día."}
  usliq_tga_close_d: {publicacion: "Daily Treasury Statement, saldo de cierre de la TGA", frecuencia: D, retardo_dias: [{desde: 1900-01-01, dias: 1, supuesto: true}], fuente: "El DTS del día d sale el día hábil siguiente a las 16:00."}
  ecb_eurosystem_total_assets_w: {publicacion: "BCE, estado financiero semanal del Eurosistema: semana fechada en LUNES en el warehouse; estado del viernes; publicación el martes siguiente", frecuencia: W, retardo_dias: [{desde: 1900-01-01, dias: 8, supuesto: true}], fuente: "lunes + 8 = martes de la semana siguiente (Validador v0.1: con 5 días, 43 celdas usaban un dato no publicado)."}
  cbbs_boj_total_assets_m: {publicacion: "BoJ, Accounts (fin de mes; primeros días hábiles del mes siguiente)", frecuencia: M, retardo_dias: [{desde: 1900-01-01, dias: 7, supuesto: true}], fuente: "Supuesto 7 días."}
