# Registro de hipótesis preregistradas (docs/models/research_program.md §1.2).
# Se escriben ANTES de mirar el resultado. No se borran ni se editan las ya registradas:
# un cambio = hipótesis nueva con referencia a la anterior. Se registran también las que fallan.
#
# Periodo bloqueado: 2005-01 -> abierto (decisión del usuario, 2026-10-14).
# La investigación empírica y el diseño del modelo base usan solo datos con fecha <= 2004-12.

- id: H-DER-001
  registrada: 2026-10-14
  autor: usuario + coordinador
  estado: preregistrada (sin datos mirados después de 2004)
  bloque: mercados / derivados
  modulo: derivados (adicional; se evalúa en el walk-forward cuando cumpla su historia mínima)
  mecanismo: >
    La estructura temporal de la volatilidad implícita refleja cuánto riesgo inmediato descuenta el
    mercado. En condiciones normales la curva de futuros del VIX está en contango (el futuro a 2 meses
    por encima del de 1 mes). Cuando el mercado percibe un deterioro inminente, la volatilidad a corto
    supera a la de plazo (backwardation). La aversión al riesgo y el endurecimiento de las condiciones
    financieras preceden y acompañan a la caída de la actividad.
  variable:
    serie: cboe_vx
    definicion: pendiente = futuro VIX a vencimiento constante 60 d - 30 d (puntos de índice), media mensual de datos diarios
    transformacion: nivel de la pendiente; y un indicador de backwardation = pendiente < 0 en más de la mitad de los días del mes
    fijada_a_priori: sí (no se exploran otras definiciones con datos 2005-2026)
  objetivo: P(G alto) del nowcast (eje de crecimiento)
  signo_esperado: pendiente más baja / backwardation -> menor P(G alto)
  horizonte: 0-3 meses
  disponibilidad: 2004-03 -> hoy, diaria; retardo t+1 día hábil
  evaluacion: >
    Contenido incremental en log-loss frente al modelo base sin la variable, en el walk-forward
    point-in-time, dentro de la evaluación única del periodo bloqueado. Sin ajuste de umbrales ni de
    ventanas con datos posteriores a 2004.
  criterio_exito: mejora de log-loss con intervalo bootstrap por bloques que no incluye el cero, y signo correcto
  advertencias: >
    Solo 2 recesiones NBER (2008, 2020) en su historia: no cumple la regla de admisión al modelo
    principal (>= 3 recesiones o >= 6 cambios de régimen) hasta acumular más cambios de régimen.

- id: H-DER-002
  registrada: 2026-10-14
  autor: usuario + coordinador
  estado: preregistrada (sin datos mirados después de 2004)
  bloque: mercados / derivados
  modulo: derivados (adicional; se evalúa en el walk-forward cuando cumpla su historia mínima)
  mecanismo: >
    La volatilidad implícita de los bonos del Tesoro mide la incertidumbre sobre la trayectoria de
    tipos e inflación. Sube cuando el mercado no sabe si la política monetaria va a endurecerse
    (inflación) o relajarse (recesión). Una incertidumbre de tipos alta encarece la financiación a
    plazo y precede a peores condiciones de crecimiento; su subida combinada con breakevens al alza
    apunta a riesgo inflacionista.
  variable:
    serie: mpls_mpd
    definicion: desviación típica implícita del rendimiento del Treasury a 10 años a 6 meses vista (Fed de Minneapolis), dato semanal -> último dato del mes
    transformacion: z-score con ventana expansiva (solo datos <= t)
    fijada_a_priori: sí (no se exploran otros plazos ni transformaciones con datos 2005-2026)
  objetivo: P(G alto) y P(I alta) del nowcast
  signo_esperado: >
    volatilidad implícita alta -> menor P(G alto); volatilidad alta junto con breakevens a 5 años
    subiendo -> mayor P(I alta)
  horizonte: 0-6 meses
  disponibilidad: 2006 -> hoy, semanal; retardo +14 días
  evaluacion: igual que H-DER-001
  criterio_exito: igual que H-DER-001, por eje
  advertencias: >
    Nace en 2006, dentro del periodo bloqueado: no hay ningún dato en el periodo de investigación.
    Toda su evaluación es fuera de muestra. Solo 2 recesiones en su historia.

# ---------------------------------------------------------------------------------------------
# Capas ex post de la etiqueta (decisión del usuario, 2026-10-15, tras la revisión del Estratega
# macro: docs/reviews/2026-10-15_estratega_macro_etiqueta.md). NO cambian la etiqueta v1.1: son
# columnas aparte, ex post como `usrec`, y PROHIBIDAS como variables de los modelos (entran en la
# lista negra). Sirven para la Etapa 2 (activos por régimen) y para los informes. Definiciones
# fijadas por teoría ANTES de evaluarlas; no se exploran variantes. Ver research/trial_log.md: la
# capa L-CAP-001 ya se miró una vez (1955-2004) en esa revisión y cuenta como prueba.

- id: L-CAP-001
  registrada: 2026-10-15
  autor: usuario + coordinador (propuesta del Estratega macro)
  estado: preregistrada; ya contrastada una vez en 1955-2004 (trial_log 2026-10-15)
  tipo: capa ex post (no es variable)
  nombre: infl_dir (dirección de la inflación)
  mecanismo: >
    Los precios de los activos responden a la aceleración o desaceleración de la inflación más que a su
    nivel: una inflación que acelera endurece la política monetaria esperada y sube la prima por plazo
    (malo para bonos y para la valoración de la bolsa); una que desacelera hace lo contrario.
  definicion: >
    dI_t = I_t - I_{t-6}, con I el eje de inflación de la etiqueta v1.1 (PCE subyacente 6 m centrada,
    empalmada). P(acelera)_t = Phi(dI_t / (s_I * sqrt(2))), s_I = 0,31 pp. Etiqueta dura: "acelera" si
    P >= 0,5. Frontera si max(P, 1-P) < 0,55.
  uso: cuadrante x recesión x dirección en la Etapa 2; contraste principal preregistrado =
    "G bajo e inflación acelerando" frente al resto (bolsa y 60/40 frente a oro y materias primas).
  exito_etapa2: mismo signo del contraste en 1955-79 y 1980-2004; el periodo bloqueado se evalúa una vez.

- id: L-CAP-002
  registrada: 2026-10-15
  autor: usuario + coordinador (propuesta del Estratega macro)
  estado: preregistrada (sin datos mirados)
  tipo: capa ex post (no es variable)
  nombre: energy_shock (shock energético)
  mecanismo: >
    Los shocks de oferta energética mueven la inflación general, la renta real de los hogares, los
    breakevens y las materias primas aunque la subyacente apenas cambie (1986, 1999-2000, 2026). El eje
    de la etiqueta usa la subyacente a propósito; esta capa recoge lo que deja fuera.
  definicion: >
    gap_t = I^general_t - I_t, con I^general la misma transformación (6 m centrada, anualizada) sobre
    PCEPI (desde 1959; antes, sin capa). oil_t = variación a/a del precio del crudo: WPU0561 (PPI crudo,
    1947->) hasta 1985-12 y MCOILWTICO desde 1986-01 (empalme en nivel, anotado).
    Shock alcista si gap_t > +1,0 pp o oil_t > +40 %; bajista si gap_t < -1,0 pp o oil_t < -40 %;
    neutro en otro caso. Si las dos señales se contradicen, manda gap_t.
  uso: capa de informe y condicionante en la Etapa 2 (materias primas, breakevens, renta variable energía).

- id: L-CAP-003
  registrada: 2026-10-15
  autor: usuario + coordinador (propuesta del Estratega macro)
  estado: preregistrada (sin datos mirados)
  tipo: capa ex post (no es variable)
  nombre: slack (holgura del mercado laboral)
  mecanismo: >
    Dentro de "crecimiento con inflación alta" (id late_cycle) conviven recuperaciones tempranas (paro
    por encima de su nivel de equilibrio, inflación que tiende a bajar) y sobrecalentamientos (paro por
    debajo, presión salarial). La holgura los distingue y cambia el posicionamiento (duración, crédito).
  definicion: >
    slack_t = UNRATE_t (media de 3 m centrada) - NROU_t (CBO, trimestral interpolada a mensual; solo
    fechas <= t, nunca las proyecciones). Holgura si slack_t > +0,5 pp; tensión si < -0,5 pp; neutro
    entre medias. Ex post: última vintage de UNRATE y NROU.
  uso: subdividir "crecimiento con inflación alta" en recuperación (holgura) frente a sobrecalentamiento
    (tensión) en informes y en la Etapa 2.

# ---------------------------------------------------------------------------------------------
# Módulo adicional de la base point-in-time v0.2 (decisión C del usuario, 2026-10-15). Variables que nacen en 2003, en
# el borde del periodo bloqueado: solo 2 años de datos <= 2004 y 0 recesiones. Definiciones fijadas a priori por teoría
# (research/pit_whitelist.yaml v0.2), SIN mirar datos posteriores a 2004 ni su relación con la etiqueta. Se evalúan como
# módulo adicional en la evaluación única del walk-forward point-in-time (modo vintage; latest_truncated como
# sensibilidad), igual que H-DER-001/002. Propuesta del Estratega macro (H8): su mecanismo actúa sobre precios de
# activos; se preregistran también para la Etapa 2.

- id: H-MOD-001
  registrada: 2026-10-15
  autor: usuario + coordinador (Constructor PIT v0.2)
  estado: preregistrada (sin datos mirados después de 2004)
  bloque: liquidez
  modulo: adicional (nowcast) y Etapa 2
  mecanismo: >
    La liquidez neta del sistema (balance de la Fed menos la cuenta del Tesoro y los repos inversos) son las reservas
    que bancos e intermediarios pueden desplegar en activos de riesgo y crédito. Su expansión relaja las condiciones
    financieras y sostiene la demanda; su contracción las endurece.
  variable:
    nombre: net_liq_yoy
    definicion: 100·log(L_t / L_{t-12}), L = WALCL − TGA (saldo diario DTS desde 2005-10; media semanal H.4.1 antes) − RRPONTSYD, en millones de USD, último dato publicado en t
    fijada_a_priori: sí
  objetivo: P(G alto) del nowcast; en la Etapa 2, rendimiento relativo de la renta variable
  signo_esperado: positivo
  horizonte: 0-6 meses
  disponibilidad: 2003-12 -> hoy; retardo 1 día (H.4.1, DTS, NY Fed)
  evaluacion: contenido incremental en log-loss frente al modelo base sin la variable, en el walk-forward PIT, dentro de la evaluación única
  criterio_exito: mejora de log-loss con intervalo bootstrap por bloques que no incluye el cero, y signo correcto
  advertencias: empalme de la TGA en 2005-10 (conceptos distintos; el a/a lo cruza durante 12 meses); 2 recesiones en su historia

- id: H-MOD-002
  registrada: 2026-10-15
  autor: usuario + coordinador (Constructor PIT v0.2)
  estado: preregistrada (sin datos mirados después de 2004)
  bloque: liquidez
  modulo: adicional (nowcast) y Etapa 2
  mecanismo: >
    La expansión conjunta de los balances de los grandes bancos centrales (Fed, BCE, BoJ) aumenta la liquidez global en
    dólares, reduce primas de riesgo y sostiene los precios de activos y la actividad global.
  variable:
    nombre: global_cb_usd_yoy
    definicion: 100·log(G_t / G_{t-12}), G = WALCL + activos del Eurosistema × USD/EUR + activos del BoJ × 100 / JPY por USD (millones de USD)
    fijada_a_priori: sí
  objetivo: P(G alto) del nowcast; en la Etapa 2, renta variable global y materias primas
  signo_esperado: positivo
  horizonte: 0-6 meses
  disponibilidad: 2003-12 -> hoy; retardos BCE 8 d, BoJ 7 d, Fed y tipos de cambio 1 d
  evaluacion: igual que H-MOD-001
  criterio_exito: igual que H-MOD-001
  advertencias: mezcla efectos de tipo de cambio con cambios de balance; 2 recesiones en su historia

- id: H-MOD-003
  registrada: 2026-10-15
  autor: usuario + coordinador (Constructor PIT v0.2)
  estado: preregistrada (sin datos mirados después de 2004)
  bloque: inflación / derivados
  modulo: adicional (nowcast)
  mecanismo: >
    El breakeven a 5 años (Treasury nominal − TIPS) es la inflación que descuenta el mercado; cuando sube, anticipa
    presión de precios y una Fed más restrictiva. Es la expectativa con fecha de mercado (complementa a Michigan y SPF).
  variable:
    nombre: t5yie
    definicion: nivel de T5YIE, último dato diario publicado en t
    fijada_a_priori: sí
  objetivo: P(I alta) del nowcast
  signo_esperado: positivo
  horizonte: 0-12 meses
  disponibilidad: 2003-01 -> hoy; retardo 1 día
  evaluacion: igual que H-MOD-001, sobre el eje I
  criterio_exito: igual que H-MOD-001
  advertencias: prima de liquidez de los TIPS (2008) distorsiona el nivel; 2 recesiones

- id: H-MOD-004
  registrada: 2026-10-15
  autor: usuario + coordinador (Constructor PIT v0.2)
  estado: preregistrada (sin datos mirados después de 2004)
  bloque: tipos
  modulo: adicional (nowcast)
  mecanismo: >
    El tipo real a 10 años (TIPS) es el coste real de la financiación a largo plazo; un tipo real alto frena la
    inversión, la vivienda y la valoración de activos con retardo.
  variable:
    nombre: dfii10
    definicion: nivel de DFII10, último dato diario publicado en t
    fijada_a_priori: sí
  objetivo: P(G alto) del nowcast
  signo_esperado: negativo
  horizonte: 6-18 meses
  disponibilidad: 2003-01 -> hoy; retardo 1 día
  evaluacion: igual que H-MOD-001
  criterio_exito: igual que H-MOD-001
  advertencias: 2 recesiones en su historia

# Sensibilidades de calendario preregistradas (base PIT v0.2). No son hipótesis de relación: el arnés las publica
# junto a la evaluación única.
- id: S-PIT-001
  registrada: 2026-10-15
  autor: usuario + coordinador (Validador I-3, Estratega C3)
  estado: preregistrada
  tipo: sensibilidad de calendario
  definicion: >
    Encuestas de Filadelfia (actividad, nuevos pedidos, precios pagados) con el dato de t−1 antes de 1990-07 (retardo
    +25 días tras el fin de mes) en lugar del tercer jueves del mes t. Matriz pit_us_v0.2_vintage_filadelfia_prudente.
  criterio: el arnés publica las métricas del modelo con las dos matrices; si la diferencia de log-loss ≤ 2004 supera
    el intervalo bootstrap de la principal, las variables de Filadelfia antes de 1990 pasan a condicionales.

- id: S-PIT-002
  registrada: 2026-10-15
  autor: usuario + coordinador (Estratega H4)
  estado: preregistrada
  tipo: sensibilidad de definición
  definicion: >
    Michigan pasó a encuesta web en 2024 (salto de nivel). En la evaluación única se publica también el modelo con
    umcsent y mich_infl_exp en Δ12m en lugar de nivel.

# ---------------------------------------------------------------------------------------------
# Adenda de evaluación (base PIT v0.3, 2026-10-15; Validador v0.2, M-6). COMPLETA H-MOD-001..004 y S-PIT-002 sin
# editarlas (regla de este fichero). Escrita sin mirar datos ni relaciones con la etiqueta en ningún periodo.

- id: P-EVAL-MOD
  registrada: 2026-10-15
  autor: usuario + coordinador (Constructor PIT v0.3)
  estado: preregistrada (sin datos mirados)
  completa: [H-MOD-001, H-MOD-002, H-MOD-003, H-MOD-004]
  evidencia_previa: >
    Las cuatro variables solo tienen 12-24 meses con fecha de decisión <= 2004 (desde 2003-01/2003-12) y ninguna
    recesión: toda su evidencia saldrá de la evaluación única del periodo bloqueado. No se ajusta nada con ellas antes.
  modelo_base: >
    El modelo principal preregistrado por el arnés (entregable 3) en modo vintage, con su conjunto de variables de la
    época E4 congelado ANTES de la evaluación única, reentrenado en el mismo walk-forward (ventana expansiva, embargo de
    6 meses, etiquetas de entrenamiento recalculadas con datos <= T). El modelo con módulo = el mismo + la variable, con
    la misma especificación y los mismos hiperparámetros. Sensibilidad: lo mismo en latest_truncated.
  metrica:
    eje_G: log-loss binaria de P(G alto) del modelo frente al objetivo blando p_g_high de la etiqueta oficial (H-MOD-001, 002, 004)
    eje_I: log-loss binaria de P(I alta) frente al objetivo blando p_i_high de la etiqueta oficial (H-MOD-003)
    muestra: meses puntuables (weight > 0, no provisionales) del periodo bloqueado en que la variable tiene valor
    contraste: diferencia media de log-loss (base − base + módulo); > 0 = el módulo mejora
  bootstrap: >
    Bootstrap por bloques circular sobre la serie mensual de diferencias de log-loss, bloques de 12 meses (≥ 2× el
    embargo; la etiqueta solapa ~9 meses), 5.000 réplicas, semilla 20261015, intervalo percentil al 95 %.
  multiplicidad: >
    Corrección de Holm sobre las 4 hipótesis H-MOD (α familiar = 0,05), con el p-valor bootstrap unilateral
    (proporción de réplicas con diferencia <= 0). Se informa también sin corregir.
  criterio_exito: >
    Mejora media > 0, significativa tras Holm, signo del coeficiente o de la dependencia parcial igual al preregistrado
    en cada H-MOD, y sin cambio de signo de la mejora entre 2005-2014 y 2015 en adelante (estabilidad).

- id: P-EVAL-S-PIT-002
  registrada: 2026-10-15
  autor: usuario + coordinador (Constructor PIT v0.3)
  estado: preregistrada (sin datos mirados)
  completa: [S-PIT-002]
  criterio: >
    Se evalúan dos especificaciones del mismo modelo: Michigan en nivel (principal) y en Δ12m. Se adopta Δ12m para
    producción solo si su log-loss (ejes G e I, como en P-EVAL-MOD) en los meses puntuables desde 2024-01 (encuesta web)
    mejora la del nivel con el intervalo bootstrap al 95 % (bloques de 12 meses) que excluye el cero, sin empeorar la
    log-loss del resto del periodo bloqueado en más que la anchura de su intervalo. Si no, se mantiene el nivel. Ambas
    se publican siempre.
